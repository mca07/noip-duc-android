name: APK bauen

# Läuft bei jedem Push auf main und auf Knopfdruck (Actions › "APK bauen" › Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK ist auf den GitHub-Runnern vorinstalliert; Lizenzen akzeptieren.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit-Tests
        run: gradle test --no-daemon

      - name: Debug-APK bauen
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: noip-duc-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
